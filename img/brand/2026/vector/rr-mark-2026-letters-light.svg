</linearGradient>
<filter id="ringBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="ringBlurWide" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
<filter id="smokeBlur" x="-50%" y="-50%" width="200%" height="200%">
