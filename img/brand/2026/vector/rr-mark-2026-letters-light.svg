<svg xmlns="http://www.w3.org/2000/svg" viewBox="283 291 680 680" width="1254" height="1254">
<title>Rough-In Redlines</title>
<defs>
<radialGradient id="disc" cx="50%" cy="46%" r="52%">
  <stop offset="0" stop-color="#1A1B1F"/><stop offset="0.75" stop-color="#101114"/><stop offset="1" stop-color="#060607"/>
</radialGradient>
<radialGradient id="smoke" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#E0221A" stop-opacity="0.85"/><stop offset="0.55" stop-color="#9E120E" stop-opacity="0.42"/><stop offset="1" stop-color="#5A0806" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ring" x1="0.08" y1="0.12" x2="0.92" y2="0.88">
