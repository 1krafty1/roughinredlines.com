</linearGradient>
<linearGradient id="ringGlow" x1="0.08" y1="0.12" x2="0.92" y2="0.88">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.35" stop-color="#FF6650" stop-opacity="0.75"/><stop offset="1" stop-color="#FF1A00"/>
</linearGradient>
<linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="890">
