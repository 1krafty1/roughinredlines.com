  <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
