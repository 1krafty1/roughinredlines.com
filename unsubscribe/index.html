<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src https://noeyxudzjruectngwswt.supabase.co https://eiavugvfmqglqqwanpmf.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Unsubscribe — Rough-In Redlines</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Email unsubscribe confirm (Teams notifications). Opening this page changes nothing: only the button does (a POST),
     so link-prefetching mail scanners can't unsubscribe anyone. System fonts, no third-party requests. */
  :root {
    --ink: #08090C; --on-ink: #F4F5F7; --red: #D42F17; --red-ink: #FF6A4D;
    --bg: #0E0F13; --surface: #15171C; --fg: #F2F3F5; --fg-dim: #B3B9C2; --line: #272A31; --ok: #4CC38A;
    --body: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
  header { background: var(--ink); color: var(--on-ink); padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.09); }
  header .bar { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  header img { width: 34px; height: 34px; }
  header b { font-size: 18px; font-weight: 800; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; text-align: center; }
  h1 { font-size: clamp(22px, 5vw, 28px); font-weight: 800; line-height: 1.2; margin: 0 0 10px; overflow-wrap: anywhere; }
  p { color: var(--fg-dim); margin: 0 auto 16px; max-width: 440px; }
  button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid transparent; cursor: pointer; padding: 11px 22px; min-height: 44px;
           background: var(--red); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 3px solid var(--red-ink); outline-offset: 2px; }
  .done { color: var(--ok); }
  .err { color: var(--red-ink); }
</style>
</head>
<body>
<header><div class="bar"><img src="/img/logo.svg" alt=""><b>Rough-In Redlines</b></div></header>
<main><div class="card" id="box">
  <h1 id="title">Unsubscribe from emails?</h1>
  <p id="what"></p>
  <button type="button" id="go" data-testid="unsubscribe">Unsubscribe</button>
  <p id="msg" role="status" style="margin-top:16px"></p>
</div></main>
<script>
(function () {
  // Real users' emails come from the PRODUCTION Teams service (roughin-teams-prod). Only a link that says env=dev (a test
  // build's email from roughin-teams-dev) goes to DEV.
  var HOSTS = { prod: "https://noeyxudzjruectngwswt.supabase.co", dev: "https://eiavugvfmqglqqwanpmf.supabase.co" };
  var LABELS = { assigned: "Assigned to you", status: "Status changes on your items", verify: "Done items to verify", comment: "Comments",
    mention: "@mentions", revision_items: "New revisions on sheets with your open items", revision: "Other new revisions", inbox: "Office inbox" };
  var q = {};
  location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  // The parameters stay out of the address bar from here on (and out of any later bookmark or screenshot).
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  var title = document.getElementById("title"), what = document.getElementById("what"), go = document.getElementById("go"), msg = document.getElementById("msg");
  var valid = /^[0-9a-f-]{36}$/i.test(q.u || "") && (q.k === "all" || LABELS.hasOwnProperty(q.k)) && !!q.t;
  if (!valid) {
    title.textContent = "This unsubscribe link isn't complete";
    what.textContent = "Use the Unsubscribe link at the bottom of the email, or change your notification settings in the app: account button → Notifications.";
    go.hidden = true;
    return;
  }
  what.textContent = q.k === "all"
    ? "You'll stop getting the daily summary and every other Teams notification email. You can turn them back on in the app: account button → Notifications."
    : "You'll stop getting “" + LABELS[q.k] + "” emails. Other emails and the app's notifications don't change. You can turn them back on in the app: account button → Notifications.";
  go.addEventListener("click", function () {
    go.disabled = true; msg.className = ""; msg.textContent = "Unsubscribing…";
    var url = (q.env === "dev" ? HOSTS.dev : HOSTS.prod) + "/functions/v1/notify?u=" + encodeURIComponent(q.u) + "&k=" + encodeURIComponent(q.k) + "&t=" + encodeURIComponent(q.t);
    fetch(url, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "List-Unsubscribe=One-Click",
                 cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) {
        if (r.ok) { title.textContent = "You're unsubscribed"; msg.className = "done"; msg.textContent = "Done. You can close this page."; go.hidden = true; }
        else if (r.status === 400) { msg.className = "err"; msg.textContent = "This unsubscribe link isn't valid any more. Change your settings in the app: account button → Notifications."; }
        else { msg.className = "err"; msg.textContent = "That didn't work. Try again in a minute."; go.disabled = false; }
      })
      .catch(function () { msg.className = "err"; msg.textContent = "No connection. Try again when you're online."; go.disabled = false; });
  });
})();
</script>
</body>
</html>
